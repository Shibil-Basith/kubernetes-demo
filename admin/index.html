<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #1f2937;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */

        .sidebar {
            width: 240px;
            background: #111827;
            color: white;
            padding: 25px 18px;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .logo span {
            color: #6366f1;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 8px;
        }

        .menu a {
            display: block;
            padding: 13px 15px;
            color: #9ca3af;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s;
        }

        .menu a:hover,
        .menu a.active {
            background: #1f2937;
            color: white;
        }

        /* Main */

        .main {
            flex: 1;
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 28px;
        }

        .admin {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Cards */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .card p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card h2 {
            font-size: 28px;
        }

        /* Content */

        .content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .panel h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        /* Form */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #6366f1;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #6366f1;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        /* Table */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            font-size: 13px;
            color: #6b7280;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        .price {
            font-weight: bold;
            color: #16a34a;
        }

        .empty {
            text-align: center;
            color: #9ca3af;
            padding: 30px;
        }

        /* Message */

        #message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Responsive */

        @media (max-width: 900px) {

            .sidebar {
                display: none;
            }

            .content {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {

            .main {
                padding: 15px;
            }

            .topbar h1 {
                font-size: 22px;
            }

            .admin {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            Admin<span>Panel</span>
        </div>

        <ul class="menu">

            <li>
                <a href="#" class="active">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="#">
                    Products
                </a>
            </li>

            <li>
                <a href="#">
                    Orders
                </a>
            </li>

            <li>
                <a href="#">
                    Customers
                </a>
            </li>

            <li>
                <a href="#">
                    Settings
                </a>
            </li>

        </ul>

    </aside>


    <!-- Main Content -->

    <main class="main">

        <!-- Top Bar -->

        <div class="topbar">

            <div>
                <h1>Product Dashboard</h1>
                <p style="color:#6b7280; margin-top:5px;">
                    Manage your products
                </p>
            </div>

            <div class="admin">
                👤 Admin
            </div>

        </div>


        <!-- Statistics -->

        <div class="stats">

            <div class="card">
                <p>Total Products</p>
                <h2 id="productCount">0</h2>
            </div>

            <div class="card">
                <p>Total Inventory Value</p>
                <h2 id="totalValue">₹0.00</h2>
            </div>

            <div class="card">
                <p>Dashboard Status</p>
                <h2 style="color:#16a34a;">
                    Online
                </h2>
            </div>

        </div>


        <!-- Content -->

        <div class="content">


            <!-- Add Product -->

            <div class="panel">

                <h2>Add Product</h2>

                <div id="message"></div>

                <form id="productForm">

                    <div class="form-group">

                        <label for="name">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter product name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Enter product description"
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="price">
                            Price
                        </label>

                        <input
                            type="number"
                            id="price"
                            placeholder="Enter price"
                            step="0.01"
                            min="0"
                            required
                        >

                    </div>


                    <button type="submit">
                        + Add Product
                    </button>

                </form>

            </div>


            <!-- Product List -->

            <div class="panel">

                <h2>Products</h2>

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Price</th>
                            </tr>

                        </thead>

                        <tbody id="productTable">

                            <tr>
                                <td colspan="4" class="empty">
                                    No products available
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

</div>


<script>

    const form = document.getElementById("productForm");
    const message = document.getElementById("message");

    const productTable = document.getElementById("productTable");
    const productCount = document.getElementById("productCount");
    const totalValue = document.getElementById("totalValue");

    let products = [];


    // Show message

    function showMessage(text, type) {

        message.textContent = text;

        message.className = type;

        message.style.display = "block";

        setTimeout(() => {

            message.style.display = "none";

        }, 3000);
    }


    // Add Product

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const description =
            document.getElementById("description").value.trim();

        const price =
            parseFloat(document.getElementById("price").value);


        const product = {

            name: name,

            description: description,

            price: price

        };


        try {

            const response = await fetch("/api/products", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(product)

            });


            if (!response.ok) {

                throw new Error(
                    "Failed to create product"
                );

            }


            const data = await response.json();


            showMessage(
                "Product added successfully!",
                "success"
            );


            // Add returned product to table

            products.push(data);

            renderProducts();

            form.reset();


        } catch (error) {

            console.error(error);

            showMessage(
                "Failed to add product.",
                "error"
            );

        }

    });


    // Render products

    function renderProducts() {

        productTable.innerHTML = "";


        if (products.length === 0) {

            productTable.innerHTML = `
                <tr>
                    <td colspan="4" class="empty">
                        No products available
                    </td>
                </tr>
            `;

            return;
        }


        let total = 0;


        products.forEach(product => {

            total += Number(product.price);


            const row = document.createElement("tr");


            row.innerHTML = `

                <td>${product.id ?? "-"}</td>

                <td>
                    <strong>
                        ${escapeHTML(product.name)}
                    </strong>
                </td>

                <td>
                    ${escapeHTML(product.description || "-")}
                </td>

                <td class="price">
                    ₹${Number(product.price).toFixed(2)}
                </td>

            `;


            productTable.appendChild(row);

        });


        productCount.textContent = products.length;

        totalValue.textContent =
            "₹" + total.toFixed(2);

    }


    // Prevent HTML injection

    function escapeHTML(value) {

        const div = document.createElement("div");

        div.textContent = value;

        return div.innerHTML;

    }

</script>

</body>
</html>
